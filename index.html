<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>数字中国战略星图 | 乘“数”而上 智启未来</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Microsoft YaHei', 'Inter', 'Segoe UI', 'PingFang SC', Roboto, sans-serif; color: white; }
        #info { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.65); backdrop-filter: blur(8px); padding: 8px 20px; border-radius: 40px; pointer-events: none; font-size: 14px; border-left: 4px solid #3b82f6; font-weight: 500; }
        #controls-tip { position: absolute; bottom: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.5); padding: 6px 14px; border-radius: 24px; font-size: 12px; pointer-events: none; backdrop-filter: blur(4px); }
        #reset-view { position: absolute; bottom: 20px; right: 20px; z-index: 100; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); border: 1px solid #3b82f6; padding: 8px 16px; border-radius: 30px; color: white; cursor: pointer; font-size: 14px; transition: 0.2s; }
        #reset-view:hover { background: #1e3a8a; }
    </style>
</head>
<body>
    <div id="info">🌌 数字中国战略星图 | 拖拽旋转 · 点击星球跳转详情页</div>
    <div id="controls-tip">🖱️ 鼠标拖拽旋转 | 右键平移 | 滚轮缩放</div>
    <button id="reset-view">🔄 重置视角</button>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x010318);
        scene.fog = new THREE.FogExp2(0x010318, 0.0007);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(6, 4, 9);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);
        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 1.0;
        controls.zoomSpeed = 1.2;
        controls.enableZoom = true;
        controls.enablePan = true;
        controls.target.set(0, 0, 0);
        document.getElementById('reset-view').addEventListener('click', () => {
            camera.position.set(6, 4, 9);
            controls.target.set(0, 0, 0);
            controls.update();
        });

        // 星空背景
        const starGeo = new THREE.BufferGeometry();
        const starCount = 2000;
        const starPos = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPos[i*3] = (Math.random() - 0.5) * 1000;
            starPos[i*3+1] = (Math.random() - 0.5) * 600;
            starPos[i*3+2] = (Math.random() - 0.5) * 300 - 80;
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.2, transparent: true, opacity: 0.7 }));
        scene.add(stars);
        const starGeo2 = new THREE.BufferGeometry();
        const starPos2 = new Float32Array(1000 * 3);
        for (let i = 0; i < 1000; i++) {
            starPos2[i*3] = (Math.random() - 0.5) * 1400;
            starPos2[i*3+1] = (Math.random() - 0.5) * 800;
            starPos2[i*3+2] = (Math.random() - 0.5) * 400 - 150;
        }
        starGeo2.setAttribute('position', new THREE.BufferAttribute(starPos2, 3));
        const stars2 = new THREE.Points(starGeo2, new THREE.PointsMaterial({ color: 0xaaccff, size: 0.12 }));
        scene.add(stars2);

        // 中心球体
        const coreMat = new THREE.MeshStandardMaterial({ color: 0x1e6eff, emissive: 0x0a2a6a, emissiveIntensity: 0.5, metalness: 0.7, roughness: 0.2 });
        const coreSphere = new THREE.Mesh(new THREE.SphereGeometry(1.2, 64, 64), coreMat);
        scene.add(coreSphere);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.12, side: THREE.BackSide });
        const glowSphere = new THREE.Mesh(new THREE.SphereGeometry(1.35, 32, 32), glowMat);
        scene.add(glowSphere);
        // 粒子环
        const ringParticleCount = 800;
        const ringGeo = new THREE.BufferGeometry();
        const ringPositions = new Float32Array(ringParticleCount * 3);
        for (let i = 0; i < ringParticleCount; i++) {
            const angle = (i / ringParticleCount) * Math.PI * 2;
            const rad = 1.9;
            ringPositions[i*3] = Math.cos(angle) * rad;
            ringPositions[i*3+1] = Math.sin(angle) * rad * 0.4;
            ringPositions[i*3+2] = Math.sin(angle) * rad * 0.7;
        }
        ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
        const ringPoints = new THREE.Points(ringGeo, new THREE.PointsMaterial({ color: 0x5a9eff, size: 0.06 }));
        scene.add(ringPoints);
        // 中心文字
        const centerDiv = document.createElement('div');
        centerDiv.innerHTML = '✨ 数字中国 ✨<br><span style="font-size:12px;">乘数而上 智启未来</span>';
        centerDiv.style.fontSize = '20px';
        centerDiv.style.fontWeight = 'bold';
        centerDiv.style.textAlign = 'center';
        centerDiv.style.background = 'linear-gradient(135deg, #fff, #60a5fa)';
        centerDiv.style.backgroundClip = 'text';
        centerDiv.style.webkitBackgroundClip = 'text';
        centerDiv.style.color = 'transparent';
        const centerLabel = new CSS2DObject(centerDiv);
        centerLabel.position.set(0, 0.1, 0);
        scene.add(centerLabel);

        // --- 节点数据（已去掉图标字段）---
        const nodesData = [
            { type: 'video', name: '非凡“十四五”', color: 0x42a5f5, pos: [3.2, 1.6, 2.2], url: 'sub0.html' },
            { type: 'video', name: '领航数字未来', color: 0xab47bc, pos: [0.5, 2.8, 2.9], url: 'sub1.html' },
            { type: 'video', name: '“十五五”新蓝图', color: 0x26a69a, pos: [-2.5, 1.9, 2.8], url: 'sub2.html' },
            { type: 'text', name: '科技创新战略', color: 0xffa726, pos: [2.2, -1.2, -2.8], url: 'sub3.html' },
            { type: 'text', name: '数实深度融合', color: 0x66bb6a, pos: [-1.8, -1.5, -3.0], url: 'sub4.html' },
            { type: 'text', name: '产业AI新引擎', color: 0xef5350, pos: [0, -0.5, -3.8], url: 'sub5.html' }
        ];

        const planetMeshes = [];
        nodesData.forEach((node, idx) => {
            const geometry = new THREE.SphereGeometry(0.52, 48, 48);
            const material = new THREE.MeshStandardMaterial({ color: node.color, emissive: 0x222222, emissiveIntensity: 0.25, metalness: 0.65, roughness: 0.3 });
            const planet = new THREE.Mesh(geometry, material);
            planet.userData = { url: node.url };
            planet.position.set(node.pos[0], node.pos[1], node.pos[2]);
            scene.add(planet);
            const miniGlow = new THREE.Mesh(new THREE.SphereGeometry(0.68, 24, 24), new THREE.MeshBasicMaterial({ color: node.color, transparent: true, opacity: 0.15, side: THREE.BackSide }));
            planet.add(miniGlow);
            const div = document.createElement('div');
            // 修复 undefined：只显示 name
            div.textContent = `${node.name}`;
            div.style.cssText = `color:#fff; font-size:16px; font-weight:600; text-shadow:0 0 8px rgba(0,0,0,0.5); background:rgba(8,16,32,0.8); backdrop-filter:blur(6px); padding:4px 14px; border-radius:40px; border:1px solid ${new THREE.Color(node.color).getStyle()}; white-space:nowrap; font-family:Inter, sans-serif; pointer-events:none;`;
            const label = new CSS2DObject(div);
            label.position.set(node.pos[0], node.pos[1] - 0.92, node.pos[2]);
            scene.add(label);
            planetMeshes.push({ mesh: planet, label, posY: node.pos[1] });
        });

        // 连接线
        const lineMat = new THREE.LineBasicMaterial({ color: 0x3b82f6, transparent: true, opacity: 0.35 });
        planetMeshes.forEach(item => {
            const points = [new THREE.Vector3(0, 0, 0), item.mesh.position.clone()];
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            scene.add(new THREE.Line(geo, lineMat));
        });

        // 粒子系统
        const particleCount = 1500;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            const rad = 2.0 + Math.random() * 1.2;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            particlePos[i*3] = rad * Math.sin(phi) * Math.cos(theta);
            particlePos[i*3+1] = rad * Math.sin(phi) * Math.sin(theta) * 0.6;
            particlePos[i*3+2] = rad * Math.cos(phi);
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleSys = new THREE.Points(particleGeo, new THREE.PointsMaterial({ color: 0x5a9eff, size: 0.045, transparent: true }));
        scene.add(particleSys);

        // 光照
        const ambientLight = new THREE.AmbientLight(0x222222);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(3, 5, 2);
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466cc, 0.5);
        backLight.position.set(-2, -1, -3);
        scene.add(backLight);
        const fillLight = new THREE.PointLight(0xffaa66, 0.4);
        fillLight.position.set(1, 2, 2);
        scene.add(fillLight);

        // 点击跳转
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        window.addEventListener('click', (event) => {
            mouse.x = (event.clientX / renderer.domElement.clientWidth) * 2 - 1;
            mouse.y = -(event.clientY / renderer.domElement.clientHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planetMeshes.map(p => p.mesh));
            if (intersects.length > 0) {
                const url = intersects[0].object.userData.url;
                if (url) window.location.href = url;
            }
        });

        // 动画
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.008;
            particleSys.rotation.y = time * 0.1;
            ringPoints.rotation.z = Math.sin(time * 0.5) * 0.1;
            ringPoints.rotation.x = Math.cos(time * 0.3) * 0.05;
            stars.rotation.y += 0.0003;
            stars2.rotation.x += 0.0002;
            planetMeshes.forEach((item, idx) => {
                const offsetY = Math.sin(time * 1.0 + idx) * 0.02;
                item.mesh.position.y = item.posY + offsetY;
                if (item.label) item.label.position.y = item.posY - 0.92 + offsetY;
            });
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
